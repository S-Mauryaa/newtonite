services:
  postgres:
    image: postgres:17
    container_name: newtonite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: newtonite_ops
    ports:
      - "5433:5432"
    volumes:
      - newtonite_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  newtonite_postgres_data: